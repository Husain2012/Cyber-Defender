/* ---------- STATE ---------- */

function setB(i){if(st!=='play')return;const s=typeof i==='number'?G.inv[i]:i;G.mv=0;if(!s||G.bi===s){G.bi=null;G.build=null}else{G.bi=s;G.build=s.t}invDirty=1}
